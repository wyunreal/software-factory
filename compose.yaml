name: software-factory

# `docker compose up --build -d` starts the whole stack:
#   postgres  -> state, artifacts, events
#   opencode  -> isolated agent runtime (not the host's OpenCode)
#   factory   -> orchestrator; talks to opencode over the compose network
# The factory service does not spawn OpenCode itself; Compose starts it as a
# sibling container so it can be scaled/replaced independently later.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-factory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-factory}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  opencode:
    build:
      context: .
    command: ["/usr/local/bin/opencode-entrypoint.sh"]
    working_dir: /data
    # Read .env directly so host-exported variables cannot shadow the password
    # used by the factory (compose interpolation would use the host value).
    env_file:
      - path: .env
        required: true
    environment:
      # Runtime aislado: todo el estado vive dentro del contenedor/volumen.
      # No montes aquí ~/.config/opencode ni ~/.local/share/opencode del host.
      HOME: /data/opencode/home
      XDG_CONFIG_HOME: /config
      XDG_DATA_HOME: /data/opencode/data
      XDG_CACHE_HOME: /data/opencode/cache
      XDG_STATE_HOME: /data/opencode/state
      OPENCODE_SERVER_USERNAME: ${OPENCODE_SERVER_USERNAME:-opencode}
      # .env also carries factory credentials; the agent runtime must not see them.
      DATABASE_URL: ""
      POSTGRES_PASSWORD: ""
      FACTORY_API_TOKEN: ""
      WEB_AUTH_SECRET: ""
      GITHUB_APP_ID: ""
      GITHUB_APP_PRIVATE_KEY: ""
      GITHUB_APP_PRIVATE_KEY_BASE64: ""
      GITHUB_APP_PRIVATE_KEY_PATH: ""
      GITHUB_APP_WEBHOOK_SECRET: ""
      GITHUB_APP_SLUG: ""
      WEB_REGISTRATION_CODE: ""
      WEB_DATABASE_URL: ""
      WEB_COOKIE_SECURE: ""
      WEB_SESSION_TTL_HOURS: ""
      WEB_PUBLIC_ORIGIN: ""
      NEXTAUTH_URL: ""
      NEXTAUTH_SECRET: ""
      AUTH_SECRET: ""
      AUTH_TRUST_HOST: ""
      AUTH_GOOGLE_ID: ""
      AUTH_GOOGLE_SECRET: ""
      AUTH_GITHUB_ID: ""
      AUTH_GITHUB_SECRET: ""
      AUTH_APPLE_ID: ""
      AUTH_APPLE_SECRET: ""
      AUTH_AZURE_AD_ID: ""
      AUTH_AZURE_AD_SECRET: ""
      AUTH_AZURE_AD_TENANT_ID: ""
      AUTH_GITLAB_ID: ""
      AUTH_GITLAB_SECRET: ""
    volumes:
      - factory-data:/data
      - ./opencode/opencode.json:/config/opencode/opencode.json:ro
      - ./squads/software-development/agents:/config/opencode/agents:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u \"opencode:$${OPENCODE_SERVER_PASSWORD}\" http://127.0.0.1:4096/api/info >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  factory:
    build:
      context: .
    command: ["node", "dist/src/index.js"]
    depends_on:
      postgres:
        condition: service_healthy
      opencode:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      FACTORY_API_TOKEN: ${FACTORY_API_TOKEN:?FACTORY_API_TOKEN is required}
      GITHUB_APP_ID: ${GITHUB_APP_ID:?GITHUB_APP_ID is required}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:?GITHUB_APP_SLUG is required}
      FACTORY_DATA_DIR: /data
      FACTORY_OPENCODE_URL: http://opencode:4096
      FACTORY_PORT: 3000
      FACTORY_PR_POLLING: ${FACTORY_PR_POLLING:-false}
      WEB_AUTH_SECRET: ""
      GITHUB_APP_WEBHOOK_SECRET: ""
      WEB_REGISTRATION_CODE: ""
      WEB_DATABASE_URL: ""
      WEB_COOKIE_SECURE: ""
      WEB_SESSION_TTL_HOURS: ""
      WEB_PUBLIC_ORIGIN: ""
      NEXTAUTH_URL: ""
      NEXTAUTH_SECRET: ""
      AUTH_SECRET: ""
      AUTH_TRUST_HOST: ""
      AUTH_GOOGLE_ID: ""
      AUTH_GOOGLE_SECRET: ""
      AUTH_GITHUB_ID: ""
      AUTH_GITHUB_SECRET: ""
      AUTH_APPLE_ID: ""
      AUTH_APPLE_SECRET: ""
      AUTH_AZURE_AD_ID: ""
      AUTH_AZURE_AD_SECRET: ""
      AUTH_AZURE_AD_TENANT_ID: ""
      AUTH_GITLAB_ID: ""
      AUTH_GITLAB_SECRET: ""
    volumes:
      - factory-data:/data
    ports:
      - "127.0.0.1:${FACTORY_HOST_PORT:-3000}:3000"
    restart: unless-stopped

  web:
    build:
      context: ./web
    environment:
      FACTORY_API_URL: http://factory:3000
      FACTORY_API_TOKEN: ${FACTORY_API_TOKEN:?FACTORY_API_TOKEN is required}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:?GITHUB_APP_SLUG is required}
      GITHUB_APP_WEBHOOK_SECRET: ${GITHUB_APP_WEBHOOK_SECRET:?GITHUB_APP_WEBHOOK_SECRET is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      WEB_DATABASE_URL: ${WEB_DATABASE_URL:-}
      WEB_AUTH_SECRET: ${WEB_AUTH_SECRET:?WEB_AUTH_SECRET is required}
      WEB_REGISTRATION_CODE: ${WEB_REGISTRATION_CODE:-}
      WEB_COOKIE_SECURE: ${WEB_COOKIE_SECURE:-true}
      WEB_SESSION_TTL_HOURS: ${WEB_SESSION_TTL_HOURS:-168}
      WEB_PUBLIC_ORIGIN: ${WEB_PUBLIC_ORIGIN:-https://web.factory.warias.app}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://web.factory.warias.app}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-}
      AUTH_SECRET: ${AUTH_SECRET:-}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      AUTH_GITHUB_ID: ${AUTH_GITHUB_ID:-}
      AUTH_GITHUB_SECRET: ${AUTH_GITHUB_SECRET:-}
      AUTH_APPLE_ID: ${AUTH_APPLE_ID:-}
      AUTH_APPLE_SECRET: ${AUTH_APPLE_SECRET:-}
      AUTH_AZURE_AD_ID: ${AUTH_AZURE_AD_ID:-}
      AUTH_AZURE_AD_SECRET: ${AUTH_AZURE_AD_SECRET:-}
      AUTH_AZURE_AD_TENANT_ID: ${AUTH_AZURE_AD_TENANT_ID:-}
      AUTH_GITLAB_ID: ${AUTH_GITLAB_ID:-}
      AUTH_GITLAB_SECRET: ${AUTH_GITLAB_SECRET:-}
    depends_on:
      - factory
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  pgdata:
  factory-data:
