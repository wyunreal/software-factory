apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "software-factory.fullname" . }}-config
  labels:
    {{- include "software-factory.componentLabels" (dict "root" . "component" "config") | nindent 4 }}
data:
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  POSTGRES_USER: {{ .Values.postgres.auth.username | quote }}
  POSTGRES_DB: {{ .Values.postgres.auth.database | quote }}
