apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    {{- include "software-factory.componentLabels" (dict "root" . "component" "postgres") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: {{ .Values.postgres.port }}
      targetPort: postgres
      protocol: TCP
  selector:
    {{- include "software-factory.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
