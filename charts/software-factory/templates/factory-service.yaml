apiVersion: v1
kind: Service
metadata:
  name: factory
  labels:
    {{- include "software-factory.componentLabels" (dict "root" . "component" "factory") | nindent 4 }}
spec:
  # Internal only. The webapp proxies the API; there is no public Ingress for
  # this service.
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.factory.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "software-factory.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: factory
