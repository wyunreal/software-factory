apiVersion: v1
kind: Service
metadata:
  name: web
  labels:
    {{- include "software-factory.componentLabels" (dict "root" . "component" "web") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.web.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "software-factory.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
