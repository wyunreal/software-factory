{{- $secret := include "software-factory.secretName" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "software-factory.fullname" . }}-web
  labels:
    {{- include "software-factory.componentLabels" (dict "root" . "component" "web") | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicaCount }}
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "software-factory.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "software-factory.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.web.podSecurityContext | nindent 8 }}
      containers:
        - name: web
          image: "{{ .Values.web.image.repository }}:{{ .Values.web.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.web.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.web.port }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.web.port | quote }}
            - name: HOSTNAME
              value: 0.0.0.0
            - name: FACTORY_API_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "software-factory.fullname" . }}-config
                  key: FACTORY_API_URL
            - name: WEB_PUBLIC_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: {{ include "software-factory.fullname" . }}-config
                  key: WEB_PUBLIC_ORIGIN
            - name: NEXTAUTH_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "software-factory.fullname" . }}-config
                  key: NEXTAUTH_URL
            - name: AUTH_TRUST_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ include "software-factory.fullname" . }}-config
                  key: AUTH_TRUST_HOST
            - name: WEB_COOKIE_SECURE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "software-factory.fullname" . }}-config
                  key: WEB_COOKIE_SECURE
            - name: WEB_SESSION_TTL_HOURS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "software-factory.fullname" . }}-config
                  key: WEB_SESSION_TTL_HOURS
            {{- include "software-factory.secretEnv" (dict "name" "DATABASE_URL" "secretName" $secret) | nindent 12 }}
            {{- include "software-factory.secretEnv" (dict "name" "WEB_DATABASE_URL" "secretName" $secret "optional" true) | nindent 12 }}
            {{- include "software-factory.secretEnv" (dict "name" "FACTORY_API_TOKEN" "secretName" $secret) | nindent 12 }}
            {{- include "software-factory.secretEnv" (dict "name" "GITHUB_APP_SLUG" "secretName" $secret) | nindent 12 }}
            {{- include "software-factory.secretEnv" (dict "name" "GITHUB_APP_WEBHOOK_SECRET" "secretName" $secret) | nindent 12 }}
            {{- include "software-factory.secretEnv" (dict "name" "WEB_AUTH_SECRET" "secretName" $secret) | nindent 12 }}
            {{- include "software-factory.secretEnv" (dict "name" "NEXTAUTH_SECRET" "secretName" $secret "optional" true) | nindent 12 }}
            {{- include "software-factory.secretEnv" (dict "name" "WEB_REGISTRATION_CODE" "secretName" $secret "optional" true) | nindent 12 }}
            {{- include "software-factory.secretEnv" (dict "name" "AUTH_GOOGLE_ID" "secretName" $secret "optional" true) | nindent 12 }}
            {{- include "software-factory.secretEnv" (dict "name" "AUTH_GOOGLE_SECRET" "secretName" $secret "optional" true) | nindent 12 }}
            {{- include "software-factory.secretEnv" (dict "name" "AUTH_GITHUB_ID" "secretName" $secret "optional" true) | nindent 12 }}
            {{- include "software-factory.secretEnv" (dict "name" "AUTH_GITHUB_SECRET" "secretName" $secret "optional" true) | nindent 12 }}
            {{- include "software-factory.secretEnv" (dict "name" "AUTH_APPLE_ID" "secretName" $secret "optional" true) | nindent 12 }}
            {{- include "software-factory.secretEnv" (dict "name" "AUTH_APPLE_SECRET" "secretName" $secret "optional" true) | nindent 12 }}
            {{- include "software-factory.secretEnv" (dict "name" "AUTH_AZURE_AD_ID" "secretName" $secret "optional" true) | nindent 12 }}
            {{- include "software-factory.secretEnv" (dict "name" "AUTH_AZURE_AD_SECRET" "secretName" $secret "optional" true) | nindent 12 }}
            {{- include "software-factory.secretEnv" (dict "name" "AUTH_AZURE_AD_TENANT_ID" "secretName" $secret "optional" true) | nindent 12 }}
            {{- include "software-factory.secretEnv" (dict "name" "AUTH_GITLAB_ID" "secretName" $secret "optional" true) | nindent 12 }}
            {{- include "software-factory.secretEnv" (dict "name" "AUTH_GITLAB_SECRET" "secretName" $secret "optional" true) | nindent 12 }}
          startupProbe:
            httpGet:
              path: /login
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /login
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
