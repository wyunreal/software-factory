apiVersion: v1
kind: Service
metadata:
  name: opencode
  labels:
    {{- include "software-factory.componentLabels" (dict "root" . "component" "opencode") | nindent 4 }}
spec:
  # Internal only. It requires HTTP Basic auth and is never exposed publicly.
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.opencode.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "software-factory.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: opencode
