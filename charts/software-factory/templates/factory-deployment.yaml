{{- $secret := include "software-factory.secretName" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "software-factory.fullname" . }}-factory
  labels:
    {{- include "software-factory.componentLabels" (dict "root" . "component" "factory") | nindent 4 }}
spec:
  replicas: {{ .Values.factory.replicaCount }}
  strategy:
    # The worker is single-instance and owns the shared worktree volume.
    type: Recreate
  selector:
    matchLabels:
      {{- include "software-factory.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: factory
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "software-factory.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: factory
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        {{- toYaml .Values.factory.podSecurityContext | nindent 8 }}
      containers:
        - name: factory
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "dist/src/index.js"]
          securityContext:
            {{- toYaml .Values.factory.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.factory.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "software-factory.fullname" . }}-config
          env:
            - name: FACTORY_PORT
              value: {{ .Values.factory.port | quote }}
            {{- include "software-factory.secretEnv" (dict "name" "DATABASE_URL" "secretName" $secret) | nindent 12 }}
            {{- include "software-factory.secretEnv" (dict "name" "FACTORY_API_TOKEN" "secretName" $secret) | nindent 12 }}
            {{- include "software-factory.secretEnv" (dict "name" "OPENCODE_SERVER_PASSWORD" "secretName" $secret) | nindent 12 }}
            {{- include "software-factory.secretEnv" (dict "name" "GITHUB_APP_ID" "secretName" $secret) | nindent 12 }}
            {{- include "software-factory.secretEnv" (dict "name" "GITHUB_APP_SLUG" "secretName" $secret) | nindent 12 }}
            {{- include "software-factory.secretEnv" (dict "name" "GITHUB_APP_PRIVATE_KEY" "secretName" $secret "optional" true) | nindent 12 }}
            {{- include "software-factory.secretEnv" (dict "name" "GITHUB_APP_PRIVATE_KEY_BASE64" "secretName" $secret "optional" true) | nindent 12 }}
          startupProbe:
            tcpSocket:
              port: http
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - 'curl -fsS -H "Authorization: Bearer $FACTORY_API_TOKEN" http://127.0.0.1:{{ .Values.factory.port }}/health >/dev/null'
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.factory.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          {{- if .Values.data.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "software-factory.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
