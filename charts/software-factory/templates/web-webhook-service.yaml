{{- if .Values.web.tailscaleFunnel.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: web-webhook
  labels:
    {{- include "software-factory.componentLabels" (dict "root" . "component" "web") | nindent 4 }}
spec:
  type: NodePort
  selector:
    {{- include "software-factory.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: {{ .Values.web.port }}
      targetPort: http
      protocol: TCP
      nodePort: {{ .Values.web.tailscaleFunnel.nodePort }}
{{- end }}
